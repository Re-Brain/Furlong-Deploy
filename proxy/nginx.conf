# Cloudflare terminates HTTPS and forwards here over plain HTTP (Flexible
# mode), so this only needs to listen on 80 and route by hostname to the
# right internal container - no certificates involved on this side at all.

server {
    listen 80;
    server_name furlong.furlong-uma-project.site;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name furlong-api.furlong-uma-project.site;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
